version: "3.9"

services:
  mysql:
    image: mysql:8.4

    container_name: line-task-db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: line_task_poc
      MYSQL_USER: lineuser
      MYSQL_PASSWORD: linepass

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: